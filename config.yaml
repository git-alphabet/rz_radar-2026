global:
  state: 'B'  # 己方队伍颜色 R/B
  camera_mode: 'hik'  # 'test':测试模式,'hik':海康相机,'video':USB相机（videocapture）
  use_serial: True  # 串口启用开关  保证了无串口时能正常调试，虽然没什么影响（有try）
  use_radio: True  # 无线电启用开关  保证了无无线电时能正常调试
  use_radio_gr: True  # 是否自动启动GNU Radio接收
  save_img: False  # 是否保存图像
  map_size: [2800, 1500]  # 战场地图尺寸
  use_official_enemy_pos: True  # 是否优先使用无线链路敌方位置数据 (0x0A01) 代替雷达识别
  official_enemy_pos_timeout: 2.0  # 无线链路敌方位置数据超时时间 (秒)
  enable_recording: True  # 是否录制视频(mp4)
  record_jsonl: False  # 是否录制结构化事件到JSONL文件
  record_iq: True  # 是否录制原始IQ数据 (.cf32, ~8MB/s @ 1MHz)

alert:
  enabled: true
  base_position_cm:
    R: [0, 0]
    B: [0, 0]
  distance_threshold_cm: 250
  base_hp_drop_window_sec: 3.0
  sentry_warning_cmd_id: 0x0200

radio: # 无线电UDP接收端口 (需与GNU Radio flowgraph一致)
  host: '127.0.0.1'
  info_port: 55557
  jam_ports: [55558, 55559, 55560]

serial: # 串口
  port: '/dev/ttyCH341USB0' 
  baudrate: 115200
  timeout: 1

filter:
  type: "sliding_window"  # 可选值：kalman/sliding_window
  sliding_window:
    window_size: 5  # 滑动窗口大小
    max_inactive_time: 2.0 # 滤波器最大不活跃时间(秒)
    threshold: 100000.0
  kalman:
    max_inactive_time: 2.0

paths:
  calibration:
    red: 'arrays_test_red.npy' # 加载标定好的仿射变换矩阵
    blue: 'arrays_test_blue.npy'
  map_images:
    red: 'images-2025/map_red.jpg'  # 加载红方视角地图
    blue: 'images-2025/map_blue.jpg'
    mask: 'images-2025/map_mask.jpg' # 加载落点判断掩码
    backup: 'images-2025/map.jpg'
  models:
    car: 'models/car.engine'
    armor: 'models/armor.engine'

camera_params:
  exposure_time: 16000.0 # 曝光时间
  gain: 10.9 # 增益值
  flip_mode: 'both' # 相机反转模式: none/horizontal/vertical/both

kalman:
  process_noise: 1e-5
  measurement_noise: 1e-1

password:
  fixed_password: ''  # 固定密钥(6字节ASCII)，为空则使用无线电来源的敌方密钥
  verify_interval: 10  # 固定密钥验证周期(秒)，0=禁用周期验证

blind_zone:
  base_time: 3.0  # 基础预测时间
  offset_time: 1.7  # 时间偏移量(根据上一帧的信道占用数动态调整单点预测时间)
  points:
    R1: [[625, 1212], [2645, 700]]
    R2: [[921, 747], [1336, 813]]
    R7: [[661, 745], [441, 747]]
    B1: [[1990, 300], [85, 750]]
    B2: [[1900, 755], [1460, 688]]
    B7: [[2142, 747], [2337, 750]]

ui:
  info_panel_size: [420, 500]  # 信息面板尺寸
  map_display_size: [900, 480]  # 地图显示尺寸
  img_display_size: [1300, 900] # 画面显示尺寸